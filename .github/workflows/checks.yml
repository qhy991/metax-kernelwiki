name: CPU contracts
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/wiki.py validate
      - run: |
          bash -n experiments/native/compile.sh
          bash -n experiments/memory_order/compile.sh
          bash -n experiments/transpose/compile.sh
